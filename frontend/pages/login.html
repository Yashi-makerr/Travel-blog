<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome Back - OceanBound Travels</title>
    <!-- Prevent caching -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;800&family=Cinzel:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <style>
        :root {
            --primary: #669ccb;
            --primary-hover: #5681a7;
            --bg-glass: rgba(255, 255, 255, 0.7);
            --border-glass: rgba(102, 156, 203, 0.25);
            --text-main: #282d31;
            --text-muted: #5e666d;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, rgba(232, 241, 250, 0.85), rgba(255, 255, 255, 0.85)), 
                        url("https://images.unsplash.com/photo-1469854523086-cc02fe5d8800?auto=format&fit=crop&w=1600&q=80") no-repeat center center/cover;
            padding: 20px;
            overflow-x: hidden;
        }

        .container {
            display: flex;
            width: 100%;
            max-width: 950px;
            min-height: 550px;
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-glass);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(102, 156, 203, 0.15);
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Left Side: Welcome Text */
        .left {
            flex: 1.1;
            background: linear-gradient(to bottom, rgba(102, 156, 203, 0.5), rgba(40, 45, 49, 0.75)), 
                        url("../images/download.jpeg") no-repeat center center/cover;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
            text-align: center;
            color: #ffffff;
            position: relative;
        }

        .left::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.15);
            z-index: 1;
        }

        .text-box {
            z-index: 2;
        }

        .text-box h1 {
            font-family: 'Cinzel', serif;
            font-size: 3.5rem;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 15px;
            text-shadow: 0 4px 10px rgba(0,0,0,0.25);
            letter-spacing: 2px;
            background: linear-gradient(45deg, #ffffff, #e8f1fa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .text-box p {
            font-size: 1.1rem;
            line-height: 1.6;
            font-weight: 400;
            color: #f3f4f6;
            max-width: 340px;
            margin: 0 auto;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }

        /* Right Side: Form */
        .right {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
            background: rgba(255, 255, 255, 0.92);
            position: relative;
        }

        .right h2 {
            font-size: 2.2rem;
            color: var(--text-main);
            font-weight: 800;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        .subtitle {
            font-size: 0.95rem;
            color: var(--text-muted);
            margin-bottom: 30px;
        }

        form {
            width: 100%;
            max-width: 320px;
        }

        .input-group {
            position: relative;
            margin-bottom: 20px;
            width: 100%;
        }

        .input-group i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #8a99a8;
            font-size: 1.1rem;
            transition: color 0.3s;
        }

        input {
            width: 100%;
            padding: 14px 15px 14px 45px;
            background: rgba(255, 255, 255, 0.95);
            border: 1px solid rgba(102, 156, 203, 0.35);
            border-radius: 10px;
            color: var(--text-main);
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }

        input::placeholder {
            color: #8a99a8;
            opacity: 0.85;
        }

        input:focus {
            background: #ffffff;
            border-color: var(--primary);
            box-shadow: 0 0 10px rgba(102, 156, 203, 0.25);
        }

        input:focus + i {
            color: var(--primary);
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--primary), var(--primary-hover));
            color: #ffffff;
            border: none;
            border-radius: 10px;
            font-size: 1.05rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 156, 203, 0.35);
            margin-top: 10px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 156, 203, 0.5);
            background: linear-gradient(135deg, #7db3e2, #669ccb);
        }

        button:active {
            transform: translateY(0);
        }

        /* Divider & Socials */
        .divider {
            display: flex;
            align-items: center;
            width: 100%;
            max-width: 320px;
            margin: 25px 0;
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(102, 156, 203, 0.25);
        }

        .divider span {
            padding: 0 10px;
        }

        .social-strip {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 25px;
        }

        .social-btn {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 45px;
            height: 45px;
            background: rgba(102, 156, 203, 0.12);
            border: 1px solid rgba(102, 156, 203, 0.25);
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .social-btn img {
            width: 20px;
            height: 20px;
        }

        .social-btn:hover {
            background: rgba(102, 156, 203, 0.22);
            transform: scale(1.1);
            border-color: var(--primary);
        }

        .form-footer {
            font-size: 0.95rem;
            color: var(--text-muted);
            margin-top: 5px;
        }

        .form-footer a {
            color: var(--primary-dark);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s;
        }

        .form-footer a:hover {
            color: var(--primary);
            text-decoration: underline;
        }

        /* Modern Custom Toast Alert */
        .toast {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-20px);
            padding: 12px 25px;
            border-radius: 8px;
            color: white;
            font-weight: 500;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            z-index: 100;
            white-space: nowrap;
        }

        .toast.show {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(0);
        }

        .toast.success { background: #10b981; border: 1px solid #059669; }
        .toast.error { background: #ef4444; border: 1px solid #dc2626; }

        /* Media Queries */
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
                max-width: 450px;
            }
            .left {
                display: none;
            }
            .right {
                padding: 40px 30px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Left Section: Feature Landscape -->
        <div class="left">
            <div class="text-box">
                <h1>OceanBound Travels</h1>
                <p>Start your next adventure. Sign in to share your journey, connect with guides, and browse luxury escapes.</p>
            </div>
        </div>

        <!-- Right Section: Login Form -->
        <div class="right">
            <!-- Alert Toast -->
            <div id="authToast" class="toast"></div>

            <h2>Welcome Back</h2>
            <p class="subtitle">Please enter your details to sign in</p>
            
            <form id="loginForm">
                <div class="input-group">
                    <input type="email" placeholder="Email Address" required id="email">
                    <i class="fas fa-envelope"></i>
                </div>
                <div class="input-group">
                    <input type="password" placeholder="Password" required id="password">
                    <i class="fas fa-lock"></i>
                </div>
                <button type="submit" id="submitBtn">Sign In</button>
            </form>

            <div class="divider">
                <span>or continue with</span>
            </div>

            <div class="social-strip">
                <div class="social-btn no-modal">
                    <img src="https://cdn-icons-png.flaticon.com/512/2111/2111393.png" alt="Facebook">
                </div>
                <div class="social-btn no-modal">
                    <img src="https://cdn-icons-png.flaticon.com/512/281/281764.png" alt="Google">
                </div>
            </div>

            <div class="form-footer">
                Don't have an account? <a href="signup.html">Register Now</a>
            </div>
        </div>
    </div>

    <script src="../js/config.js"></script>
    <script>
        const form = document.getElementById("loginForm");
        const submitBtn = document.getElementById("submitBtn");
        const toast = document.getElementById("authToast");

        function showToast(message, type = "success") {
            toast.textContent = message;
            toast.className = `toast show ${type}`;
            setTimeout(() => {
                toast.classList.remove("show");
            }, 3000);
        }

        form.addEventListener("submit", async (e) => {
            e.preventDefault();

            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;

            submitBtn.textContent = "Signing in...";
            submitBtn.disabled = true;

            try {
                const res = await fetch(`${API_BASE_URL}/api/auth/login`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email, password })
                });

                const data = await res.json();

                if (!res.ok) {
                    const errMsg = data.error || (data.errors && data.errors.map(e => e.msg).join(", ")) || "Login failed.";
                    showToast(errMsg, "error");
                    submitBtn.textContent = "Sign In";
                    submitBtn.disabled = false;
                } else {
                    showToast("Login successful! Redirecting... 🎉", "success");
                    
                    // Save user to localStorage
                    localStorage.setItem("user", JSON.stringify(data.user));

                    setTimeout(() => {
                        window.location.href = "index.html";
                    }, 1500);
                }
            } catch (err) {
                console.error(err);
                showToast("Server connection error.", "error");
                submitBtn.textContent = "Sign In";
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
